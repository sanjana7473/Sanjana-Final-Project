<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Retail Analytics Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="card" style="max-width: 480px; margin: 2rem auto;">
        <h1 style="text-align: center; color: var(--primary); font-size: 2rem; margin-bottom: 2rem;">Welcome to Retail Analytics</h1>
        
        <form action="/" method="POST" class="form-group">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" required class="form-input" placeholder="Enter your username" />
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" required class="form-input" placeholder="Choose a secure password" />
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" required class="form-input" placeholder="your@email.com" />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Create Account
          </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem;">
          Already have an account? 
          <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">
            Sign in here
          </a>
        </p>
      </div>
    </div>
  </body>
</html>
